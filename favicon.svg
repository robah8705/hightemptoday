<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161f"/><stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb340"/><stop offset="1" stop-color="#ff4d1c"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)" stroke="#1e1e2e" stroke-width="2"/>
  <!-- sun, clear of the line -->
  <circle cx="51" cy="11" r="5.5" fill="url(#sun)"/>
  <!-- daily-high curve -->
  <polyline points="8,45 19,36 27,40 38,20 46,28 56,24" fill="none" stroke="#ff4d1c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="38" cy="20" r="3.2" fill="#ffb340"/>
  <!-- baseline -->
  <line x1="8" y1="52" x2="56" y2="52" stroke="#6b6b80" stroke-width="2.4" stroke-linecap="round"/>
</svg>
