<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#0a0a0f"/>
  <rect width="1600" height="8" fill="#ff4d1c"/>

  <!-- peak mark -->
  <g transform="translate(64,52)">
    <rect width="54" height="54" rx="11" fill="#16161f" stroke="#26263a"/>
    <polyline points="8,38 20,20 28,30 36,14 46,38" fill="none" stroke="#ff4d1c" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="38" cy="17" r="4.5" fill="#ffb340"/>
  </g>
  <text x="134" y="88" font-family="DejaVu Sans Mono, monospace" font-size="19" letter-spacing="3" fill="#ffb340">HIGHTEMPTODAY · SETTLEMENT, EXPLAINED</text>

  <text x="64" y="196" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="57" fill="#e8e8f0">HOW A KALSHI WEATHER MARKET SETTLES</text>
  <text x="64" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="24" fill="#a7a7ba">The chain of custody: a temperature becomes a payout in four hands. Only the last one pays you.</text>

  <!-- CARD 1 -->
  <g>
    <rect x="64" y="320" width="350" height="360" rx="12" fill="#111118" stroke="#26263a" stroke-width="2"/>
    <circle cx="104" cy="362" r="17" fill="none" stroke="#ffb340" stroke-width="2.5"/>
    <text x="104" y="370" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="19" fill="#ffb340">1</text>
    <text x="132" y="370" font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2" fill="#a7a7ba">STEP ONE</text>
    <text x="88" y="424" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="27" fill="#e8e8f0">THE STATION</text>
    <text x="88" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="20" fill="#a7a7ba">
      <tspan x="88" dy="0">One named station's</tspan>
      <tspan x="88" dy="28">sensors record the day —</tspan>
      <tspan x="88" dy="28">Central Park, Midway,</tspan>
      <tspan x="88" dy="28">Bergstrom.</tspan>
    </text>
    <rect x="88" y="612" width="302" height="34" rx="17" fill="none" stroke="#26263a"/>
    <text x="239" y="635" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="13.5" fill="#a7a7ba">NOT YOUR APP · NOT "THE CITY"</text>
  </g>

  <!-- CARD 2 -->
  <g>
    <rect x="438" y="320" width="350" height="360" rx="12" fill="#111118" stroke="#26263a" stroke-width="2"/>
    <circle cx="478" cy="362" r="17" fill="none" stroke="#ffb340" stroke-width="2.5"/>
    <text x="478" y="370" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="19" fill="#ffb340">2</text>
    <text x="506" y="370" font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2" fill="#a7a7ba">STEP TWO</text>
    <text x="462" y="424" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="27" fill="#e8e8f0">THE CLIMATE REPORT</text>
    <text x="462" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="20" fill="#a7a7ba">
      <tspan x="462" dy="0">The NWS compiles the</tspan>
      <tspan x="462" dy="28">station's day into its daily</tspan>
      <tspan x="462" dy="28">climate report — the CLI.</tspan>
    </text>
    <rect x="462" y="612" width="302" height="34" rx="17" fill="none" stroke="#26263a"/>
    <text x="613" y="635" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="13.5" fill="#a7a7ba">PRELIMINARY FIRST · FINAL FOLLOWS</text>
  </g>

  <!-- CARD 3 -->
  <g>
    <rect x="812" y="320" width="350" height="360" rx="12" fill="#111118" stroke="#26263a" stroke-width="2"/>
    <circle cx="852" cy="362" r="17" fill="none" stroke="#ffb340" stroke-width="2.5"/>
    <text x="852" y="370" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="19" fill="#ffb340">3</text>
    <text x="880" y="370" font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2" fill="#a7a7ba">STEP THREE</text>
    <text x="836" y="424" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="27" fill="#e8e8f0">THE WEATHER</text>
    <text x="836" y="456" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="27" fill="#e8e8f0">COMPANY</text>
    <text x="836" y="502" font-family="Liberation Sans, Arial, sans-serif" font-size="20" fill="#a7a7ba">
      <tspan x="836" dy="0">Publishes the day's high —</tspan>
      <tspan x="836" dy="28">in whole degrees — on its</tspan>
      <tspan x="836" dy="28">Kalshi portal.</tspan>
    </text>
    <rect x="836" y="612" width="302" height="34" rx="17" fill="none" stroke="#26263a"/>
    <text x="987" y="635" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="13.5" fill="#a7a7ba">WEATHER.COM/KALSHI</text>
  </g>

  <!-- CARD 4 -->
  <g>
    <rect x="1186" y="320" width="350" height="360" rx="12" fill="#111118" stroke="#00d4aa" stroke-width="2.5"/>
    <circle cx="1226" cy="362" r="17" fill="none" stroke="#00d4aa" stroke-width="2.5"/>
    <text x="1226" y="370" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="19" fill="#00d4aa">4</text>
    <text x="1254" y="370" font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2" fill="#00d4aa">SETTLEMENT</text>
    <text x="1210" y="424" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="27" fill="#e8e8f0">KALSHI SETTLES</text>
    <text x="1210" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="20" fill="#a7a7ba">
      <tspan x="1210" dy="0">Your bracket pays on the</tspan>
      <tspan x="1210" dy="28">first final published</tspan>
      <tspan x="1210" dy="28">value — the whole-degree</tspan>
      <tspan x="1210" dy="28">high for that station.</tspan>
    </text>
    <rect x="1210" y="612" width="302" height="34" rx="17" fill="rgba(0,212,170,0.12)" stroke="#00d4aa"/>
    <text x="1361" y="635" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="13.5" font-weight="bold" fill="#00d4aa">THIS NUMBER PAYS YOU</text>
  </g>

  <!-- arrows (drawn over the gaps) -->
  <g stroke="#ffb340" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="417,484 433,500 417,516"/>
    <polyline points="791,484 807,500 791,516"/>
    <polyline points="1165,484 1181,500 1165,516"/>
  </g>

  <!-- footer rules -->
  <line x1="64" y1="742" x2="1536" y2="742" stroke="#26263a" stroke-width="2"/>
  <text x="64" y="792" font-family="DejaVu Sans Mono, monospace" font-size="17.5" fill="#a7a7ba">THE DAY: MIDNIGHT–MIDNIGHT LOCAL STANDARD TIME — 1:00 AM TO 1:00 AM ON THE WALL CLOCK IN DAYLIGHT SAVING</text>
  <text x="64" y="830" font-family="DejaVu Sans Mono, monospace" font-size="17.5" fill="#a7a7ba">FIRST FINAL COUNTS · CORRECTIONS AFTER EXPIRATION DON'T REOPEN THE MARKET</text>
  <text x="64" y="912" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#6b6b80">By Buzz · HighTempToday.com — the desk that publishes its record, losers included.</text>
  <text x="1536" y="912" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2" fill="#6b6b80">NOT FINANCIAL ADVICE</text>
</svg>
